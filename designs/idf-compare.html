<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>השוואת סרטוני צה״ל | שמחה לביא</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0F1C27; --text: #ECEAE4; --muted: #A3B0BC; --accent: #B9CCDD; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 17px/1.6 "Assistant", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 40px 18px 60px; }
  h1 { margin: 0 0 6px; font-size: clamp(26px, 3vw, 38px); }
  p { margin: 0 0 28px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  figure { margin: 0; }
  video { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: #15283A; display: block; }
  figcaption { margin-top: 10px; font-weight: 700; }
  figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 15px; }
  .on { color: var(--accent); }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>שני סרטוני צה״ל, אותן שניות</h1>
  <p>בתיקייה יש שני סרטונים ארוכים מספיק לשניות שביקשת (0:15–0:16, 0:21–0:24, 1:06–1:07, 1:18–1:24, 2:01–2:04, 2:14–2:17). שניהם חתוכים לפי אותן שניות ומוחשכים קצת, אחרי שוט הפתיחה מההרצאה.</p>
  <div class="grid">
    <figure><video src="../videos/hero-lecture.mp4" autoplay muted loop playsinline></video>
      <figcaption class="on">א. ״סרטון ארוך שמחה״ (באתר עכשיו)<span>ריצה בקבוצה, סימון מטרה, טיפוס על קיר, מתח, ריצה</span></figcaption></figure>
    <figure><video src="idf/hero-boch.mp4" autoplay muted loop playsinline></video>
      <figcaption>ב. ״סרטון קצר בוחמס סופי״<span>טיפוס על קיר, מסלול מכשולים, נדנדה, זחילה, מתקן אדום, זחילה מתחת לגדר</span></figcaption></figure>
  </div>
</main>
</body>
</html>
